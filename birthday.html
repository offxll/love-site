<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Письмо Деду Морозу 🎅</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow-x: hidden;
    font-family: 'Segoe UI', -apple-system, sans-serif;
  }

  body {
    position: relative;
    background: linear-gradient(180deg, #0a1a3a 0%, #1a2f5a 40%, #3a4a7a 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
    color: #fff;
    user-select: none;
  }

  /* Снег */
  .snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .flake {
    position: absolute;
    top: -20px;
    color: #fff;
    opacity: 0.85;
    animation: fall linear infinite;
    text-shadow: 0 0 6px rgba(255,255,255,0.9);
  }

  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); }
    100% { transform: translateY(105vh) rotate(360deg); }
  }

  /* Звёзды */
  .bg-stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 80% 20%, #fff, transparent),
      radial-gradient(2px 2px at 40% 90%, #fff, transparent),
      radial-gradient(1px 1px at 10% 60%, #fff, transparent),
      radial-gradient(2px 2px at 90% 50%, #fff, transparent),
      radial-gradient(1px 1px at 50% 10%, #fff, transparent);
    opacity: 0.6;
    animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.85; }
  }

  /* Контент */
  .container {
    position: relative;
    z-index: 3;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Дед Мороз */
  .santa {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 30%, #ffe0e0 0%, #ffb8b8 40%, #d64545 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 78px;
    margin-bottom: 16px;
    box-shadow:
      0 0 0 5px rgba(255,255,255,0.25),
      0 0 40px rgba(255,120,120,0.7),
      0 12px 30px rgba(0,0,0,0.4);
    animation: santaBob 3s ease-in-out infinite;
    user-select: none;
  }

  @keyframes santaBob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-8px) rotate(3deg); }
  }

  h1 {
    font-size: clamp(22px, 6.5vw, 30px);
    text-align: center;
    font-weight: 800;
    line-height: 1.35;
    margin-bottom: 24px;
    padding: 0 8px;
    background: linear-gradient(180deg, #fff 0%, #ffe6b3 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(255,180,100,0.5));
  }

  /* Открытка */
  .card {
    position: relative;
    width: 100%;
    background: linear-gradient(135deg, #fff8e8 0%, #ffeccf 100%);
    border-radius: 22px;
    padding: 22px 20px 24px;
    box-shadow:
      0 0 0 2px rgba(255,255,255,0.4),
      0 20px 50px rgba(0,0,0,0.4),
      0 0 60px rgba(255,200,120,0.35);
    color: #3a1a0a;
  }

  .card::before {
    content: "❄";
    position: absolute;
    top: 12px; right: 16px;
    font-size: 22px;
    color: #ffb85c;
    opacity: 0.7;
  }

  .card::after {
    content: "🎁";
    position: absolute;
    bottom: 12px; left: 16px;
    font-size: 22px;
    opacity: 0.7;
  }

  label {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: #7a3510;
    margin-bottom: 8px;
  }

  textarea, .name-field {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 2px solid #ffd9a0;
    background: #fffefb;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    color: #3a1a0a;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  textarea {
    min-height: 160px;
    resize: vertical;
  }

  .name-field {
    margin-bottom: 12px;
    font-size: 15px;
  }

  textarea:focus, .name-field:focus {
    border-color: #ff9f43;
    box-shadow: 0 0 0 4px rgba(255,159,67,0.2);
  }

  textarea::placeholder, .name-field::placeholder {
    color: #c9a884;
  }

  /* Кнопка */
  .send-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 16px 20px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(180deg, #ff6b6b 0%, #d63447 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 0 #8a1f2c, 0 12px 30px rgba(214,52,71,0.5);
    transition: transform 0.1s, box-shadow 0.1s;
    touch-action: manipulation;
  }

  .send-btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #8a1f2c, 0 6px 18px rgba(214,52,71,0.5);
  }

  .send-btn:disabled {
    opacity: 0.7;
    cursor: wait;
  }

  /* Финальный экран */
  .final {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: linear-gradient(180deg, #0a1a3a 0%, #1a2f5a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease;
  }

  .final.show {
    opacity: 1;
    visibility: visible;
  }

  .final-santa {
    font-size: 110px;
    margin-bottom: 24px;
    animation: santaFinal 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255,150,150,0.7));
  }

  @keyframes santaFinal {
    0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); }
    50%      { transform: translateY(-12px) rotate(4deg) scale(1.05); }
  }

  .final-text {
    font-size: clamp(22px, 6vw, 30px);
    font-weight: 800;
    line-height: 1.45;
    max-width: 480px;
    background: linear-gradient(180deg, #fff 0%, #ffd580 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 12px rgba(255,180,100,0.5));
    padding: 0 10px;
  }

  .final-snow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
</style>
</head>
<body>

  <div class="bg-stars"></div>
  <div class="snow" id="snow"></div>

  <div class="container">

    <div class="santa">🎅</div>

    <h1>Дорогая моя, что ты желаешь<br>на своё день рождения<br>или кого ты хочешь увидеть?</h1>

    <div class="card">
      <form id="wishForm" action="https://formsubmit.co/pikulsasha19@gmail.com" method="POST">

        <!-- Скрытые настройки FormSubmit -->
        <input type="hidden" name="_subject" value="🎂 Новая открытка с пожеланиями">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" style="display:none">

        <label for="name">Твоё имя 🌟</label>
        <input class="name-field" type="text" name="Имя" id="name" placeholder="Как тебя зовут?" required>

        <label for="wish">Твои пожелания 💌</label>
        <textarea name="Пожелания" id="wish" placeholder="Напиши всё, что захочешь — подарки, мечты, кого хочешь увидеть..." required></textarea>

        <button type="submit" class="send-btn" id="sendBtn">
          🎁 Запаковать и отправить
        </button>
      </form>
    </div>

  </div>

  <!-- Финальный экран -->
  <div class="final" id="finalScreen">
    <div class="final-snow" id="finalSnow"></div>
    <div class="final-santa">🎅</div>
    <div class="final-text">
      Письмо уже в пути<br>
      и поздравляю тебя<br>
      с наступающим твоим днём,<br>
      хо-хо-хо 🎄
    </div>
  </div>

<script>
  /* ===== Снег ===== */
  function makeSnow(box, count) {
    const symbols = ['❄', '❅', '❆', '*'];
    for (let i = 0; i < count; i++) {
      const f = document.createElement('div');
      f.className = 'flake';
      f.textContent = symbols[i % symbols.length];
      f.style.left = Math.random() * 100 + '%';
      f.style.fontSize = (10 + Math.random() * 14) + 'px';
      f.style.opacity = 0.3 + Math.random() * 0.6;
      f.style.animationDuration = (6 + Math.random() * 8) + 's';
      f.style.animationDelay = (-Math.random() * 10) + 's';
      box.appendChild(f);
    }
  }
  makeSnow(document.getElementById('snow'), 40);
  makeSnow(document.getElementById('finalSnow'), 30);

  /* ===== Отправка ===== */
  const form = document.getElementById('wishForm');
  const btn = document.getElementById('sendBtn');
  const finalScreen = document.getElementById('finalScreen');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = '🎁 Упаковываем...';

    try {
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      // Показываем финальный экран в любом случае —
      // чтобы девушка не видела технических ошибок
      finalScreen.classList.add('show');
    } catch (err) {
      // Даже если что-то упало с сетью — показываем тот же финальный экран
      finalScreen.classList.add('show');
    }
  });
</script>
</body>
</html>
