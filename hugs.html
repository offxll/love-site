<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Обнимашки 🤗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', -apple-system, sans-serif;
  }

  body {
    position: relative;
    background: linear-gradient(160deg, #1a0420 0%, #3d0d3a 45%, #6b1a52 100%);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  .bg-blobs {
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; filter: blur(70px); opacity: 0.55;
    pointer-events: none;
  }
  .blob {
    position: absolute; border-radius: 50%;
    mix-blend-mode: screen;
    animation: drift 20s ease-in-out infinite;
  }
  .blob:nth-child(1) { width: 60vmax; height: 60vmax; background: #ff2e88; top: -20%; left: -20%; }
  .blob:nth-child(2) { width: 50vmax; height: 50vmax; background: #a24bff; bottom: -25%; right: -20%; animation-delay: -7s; }
  .blob:nth-child(3) { width: 45vmax; height: 45vmax; background: #ff8a5c; top: 35%; left: 30%; animation-delay: -14s; }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(8vw, -6vh) scale(1.15); }
  }

  .welcome {
    position: relative; z-index: 3;
    text-align: center;
    display: none;
    flex-direction: column;
    gap: 16px;
    max-width: 400px;
    width: 100%;
    animation: fadeIn 0.7s ease;
  }

  .welcome.show { display: flex; }

  .welcome h1 {
    font-size: 32px;
    font-weight: 900;
    background: linear-gradient(180deg, #fff 0%, #ffb8d8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 12px rgba(255, 100, 170, 0.5));
    margin-bottom: 6px;
  }

  .welcome p {
    font-size: 15px;
    color: #ffd0e0;
    opacity: 0.9;
    margin-bottom: 12px;
  }

  .role-btn {
    padding: 22px;
    border: none;
    border-radius: 24px;
    font-family: inherit;
    font-size: 19px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    touch-action: manipulation;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.3), 0 15px 35px rgba(0,0,0,0.35);
    -webkit-appearance: none;
  }

  .role-btn.her { background: linear-gradient(135deg, #ff4d94 0%, #c42a6e 100%); }
  .role-btn.him { background: linear-gradient(135deg, #4a7cff 0%, #2a4ac4 100%); }

  .role-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.3); }

  .app {
    position: relative; z-index: 3;
    width: 100%;
    max-width: 460px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: fadeIn 0.7s ease;
  }

  .app.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .you-are {
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffd0e0;
    opacity: 0.75;
    font-weight: 700;
  }

  .you-are strong { color: #fff; }

  .counters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }

  .counter {
    padding: 16px 10px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255, 255, 255, 0.13);
    text-align: center;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    transition: transform 0.25s;
  }

  .counter.her-side { border-color: rgba(255, 100, 170, 0.4); }
  .counter.him-side { border-color: rgba(100, 140, 255, 0.4); }
  .counter.bump { transform: scale(1.06); }

  .counter-label {
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #d8b8e0;
    font-weight: 700;
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .counter-value {
    font-size: 38px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }

  .counter-value.highlight { color: #ffd700; }

  .total-box {
    width: 100%;
    padding: 18px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(255, 100, 170, 0.25), rgba(150, 80, 255, 0.25));
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255, 200, 230, 0.28);
    text-align: center;
    box-shadow: 0 10px 30px rgba(150, 60, 200, 0.35);
  }

  .total-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffd0e0;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .total-value {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(180deg, #fff 0%, #ffb8d8 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    filter: drop-shadow(0 2px 10px rgba(255, 100, 170, 0.5));
  }

  .hug-btn {
    width: 100%;
    padding: 30px 20px;
    border: none;
    border-radius: 32px;
    background: linear-gradient(135deg, #ff4d94 0%, #ff2e88 50%, #c42a6e 100%);
    color: #fff;
    font-family: inherit;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow:
      0 10px 0 #7a1a44,
      0 20px 50px rgba(255, 60, 140, 0.55),
      inset 0 2px 0 rgba(255, 255, 255, 0.35);
    transition: transform 0.1s, box-shadow 0.1s;
    touch-action: manipulation;
    -webkit-appearance: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .hug-btn:active {
    transform: translateY(6px);
    box-shadow:
      0 4px 0 #7a1a44,
      0 10px 25px rgba(255, 60, 140, 0.55),
      inset 0 2px 0 rgba(255, 255, 255, 0.35);
  }

  .hug-btn .emoji {
    font-size: 32px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }

  .status {
    font-size: 13px;
    color: #ffd0e0;
    opacity: 0.75;
    text-align: center;
    letter-spacing: 0.5px;
    min-height: 18px;
  }

  .status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #7effb0;
    margin-right: 6px;
    box-shadow: 0 0 8px #7effb0;
    animation: blink 2s ease-in-out infinite;
  }

  .status .dot.off {
    background: #ff5555;
    box-shadow: 0 0 8px #ff5555;
    animation: none;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  .reset-btn {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 5;
    padding: 8px 14px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.2s;
    -webkit-appearance: none;
    touch-action: manipulation;
  }

  .reset-btn:active { opacity: 1; }

  .fly-heart {
    position: fixed;
    font-size: 40px;
    pointer-events: none;
    z-index: 100;
    animation: flyUp 1.6s ease-out forwards;
    filter: drop-shadow(0 0 15px rgba(255, 100, 170, 0.9));
  }

  @keyframes flyUp {
    0% {
      transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
      opacity: 0;
    }
    20% {
      transform: translate(-50%, -50%) scale(1.3) rotate(-10deg);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, calc(-50% - 400px)) scale(0.8) rotate(20deg);
      opacity: 0;
    }
  }

  .big-hug {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 200px;
    z-index: 99;
    pointer-events: none;
    filter: drop-shadow(0 0 40px rgba(255, 80, 150, 0.9));
    animation: bigPulse 0.9s cubic-bezier(0.5, 1.6, 0.5, 1) forwards;
  }

  @keyframes bigPulse {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    40%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    70%  { transform: translate(-50%, -50%) scale(0.95); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
  }

  .flash {
    position: fixed; inset: 0;
    background: radial-gradient(circle at center, rgba(255, 100, 170, 0.5), transparent 60%);
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    animation: flashIn 0.7s ease-out forwards;
  }

  @keyframes flashIn {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

  <div class="bg-blobs">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
  </div>

  <div class="welcome" id="welcome">
    <h1>Обнимашки 🤗</h1>
    <p>Кто ты? Это нужно, чтобы считать наши обнимашки правильно</p>
    <button class="role-btn her" data-who="her">
      <span style="font-size:26px">💕</span> Я — она
    </button>
    <button class="role-btn him" data-who="him">
      <span style="font-size:26px">💙</span> Я — он
    </button>
  </div>

  <div class="app" id="app">
    <div class="you-are">Ты вошла как <strong id="roleLabel">—</strong></div>

    <div class="counters">
      <div class="counter her-side" id="herCounterBox">
        <div class="counter-label">💕 Она обняла<br>его раз</div>
        <div class="counter-value" id="herCountEl">0</div>
      </div>
      <div class="counter him-side" id="himCounterBox">
        <div class="counter-label">💙 Он обнял<br>её раз</div>
        <div class="counter-value" id="himCountEl">0</div>
      </div>
    </div>

    <div class="total-box">
      <div class="total-label">🤗 Всего вместе</div>
      <div class="total-value" id="totalEl">0</div>
    </div>

    <button class="hug-btn" id="hugBtn">
      <span class="emoji">🤗</span> ОБНЯТЬ
    </button>

    <div class="status" id="status">
      <span class="dot off"></span> Подключение к базе...
    </div>
  </div>

  <button class="reset-btn" id="resetBtn" style="display:none">Сменить роль</button>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

<script>
  /* ===== FIREBASE CONFIG ===== */
  const firebaseConfig = {
    apiKey: "AIzaSyB5QTOlEyEzNtkA_HmL1SYkHSLpeKq1-HM",
    authDomain: "hugs-e376f.firebaseapp.com",
    databaseURL: "https://hugs-e376f-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "hugs-e376f",
    storageBucket: "hugs-e376f.firebasestorage.app",
    messagingSenderId: "334197021321",
    appId: "1:334197021321:web:b968d471e08448a9b0c458"
  };

  /* ===== ID ПАРЫ ===== */
  const PAIR_ID = "offxll-love-2026";

  /* ===== DOM ===== */
  const welcomeEl = document.getElementById('welcome');
  const appEl = document.getElementById('app');
  const roleLabel = document.getElementById('roleLabel');
  const herCountEl = document.getElementById('herCountEl');
  const himCountEl = document.getElementById('himCountEl');
  const totalEl = document.getElementById('totalEl');
  const herCounterBox = document.getElementById('herCounterBox');
  const himCounterBox = document.getElementById('himCounterBox');
  const hugBtn = document.getElementById('hugBtn');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');

  const STORAGE_ROLE = 'hugs_role';

  let myRole = null;
  let db = null;
  let dbRef = null;
  let lastHerCount = 0;
  let lastHimCount = 0;
  let initialSync = true;

  /* ===== Firebase init ===== */
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    dbRef = db.ref('hugs/' + PAIR_ID);
  } catch (e) {
    console.error('Firebase error:', e);
    setStatus('Ошибка Firebase', false);
  }

  /* ===== ЗВУК ===== */
  let audioCtx = null;
  function beep(freq, dur, type, gain, delay) {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (delay || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(gain || 0.08, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }

  function soundHug() {
    beep(880, 0.15, 'sine', 0.07);
    beep(1108, 0.18, 'sine', 0.06, 0.05);
    beep(1318, 0.25, 'sine', 0.05, 0.1);
  }

  function soundReceived() {
    beep(660, 0.12, 'sine', 0.05);
    beep(880, 0.15, 'sine', 0.04, 0.05);
  }

  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
  document.addEventListener('click', unlockAudio, { once: true });

  /* ===== РОЛЬ ===== */
  function setRole(role) {
    myRole = role;
    localStorage.setItem(STORAGE_ROLE, role);

    welcomeEl.classList.remove('show');
    appEl.classList.add('show');
    resetBtn.style.display = 'block';

    roleLabel.textContent = (role === 'her') ? 'она' : 'он';

    startListening();
    setStatus('Подключение...', false);
  }

  // Проверяем сохранённую роль
  const savedRole = localStorage.getItem(STORAGE_ROLE);
  if (savedRole === 'her' || savedRole === 'him') {
    setRole(savedRole);
  } else {
    welcomeEl.classList.add('show');
  }

  document.querySelectorAll('.role-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      unlockAudio();
      setRole(btn.dataset.who);
    });
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('Сменить роль? Вернёшься к экрану выбора.')) return;
    localStorage.removeItem(STORAGE_ROLE);
    location.reload();
  });

  /* ===== ПОДПИСКА НА ИЗМЕНЕНИЯ ===== */
  function startListening() {
    if (!dbRef) return;

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const herCount = data.her || 0;
      const himCount = data.him || 0;

      // Партнёр обнял меня?
      const newFromPartner =
        (myRole === 'her' && himCount > lastHimCount) ||
        (myRole === 'him' && herCount > lastHerCount);

      // Обновляем цифры
      herCountEl.textContent = herCount;
      himCountEl.textContent = himCount;
      totalEl.textContent = herCount + himCount;

      // Подсветка моего счётчика, если я обнял
      if (myRole === 'her' && herCount > lastHerCount && !initialSync) {
        bumpCounter(herCounterBox);
        herCountEl.classList.add('highlight');
        setTimeout(() => herCountEl.classList.remove('highlight'), 400);
      }
      if (myRole === 'him' && himCount > lastHimCount && !initialSync) {
        bumpCounter(himCounterBox);
        himCountEl.classList.add('highlight');
        setTimeout(() => himCountEl.classList.remove('highlight'), 400);
      }

      // Анимация, если партнёр обнял
      if (newFromPartner && !initialSync) {
        showPartnerHugAnimation();
      }

      lastHerCount = herCount;
      lastHimCount = himCount;

      if (initialSync) {
        initialSync = false;
      }

      setStatus('Синхронизировано', true);
    }, (error) => {
      console.error('DB error:', error);
      setStatus('Ошибка базы данных', false);
    });
  }

  /* ===== НАЖАТИЕ КНОПКИ ===== */
  hugBtn.addEventListener('click', async () => {
    unlockAudio();
    if (!dbRef || !myRole) return;

    playHugAnimation();
    soundHug();

    try {
      await dbRef.child(myRole).transaction(c => (c || 0) + 1);
    } catch (e) {
      console.error('Hug failed:', e);
      setStatus('Не удалось отправить', false);
    }
  });

  /* ===== АНИМАЦИИ ===== */
  function playHugAnimation() {
    const big = document.createElement('div');
    big.className = 'big-hug';
    big.textContent = '💖';
    document.body.appendChild(big);
    setTimeout(() => big.remove(), 1000);

    const flash = document.createElement('div');
    flash.className = 'flash';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 800);

    const emojis = ['💖','💕','🩷','💗','🌸','✨'];
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'fly-heart';
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = (30 + Math.random() * 40) + '%';
        h.style.top = (50 + Math.random() * 20) + '%';
        h.style.fontSize = (28 + Math.random() * 20) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1700);
      }, i * 60);
    }

    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);

    hugBtn.style.transform = 'translateY(6px) scale(0.97)';
    setTimeout(() => { hugBtn.style.transform = ''; }, 150);
  }

  function showPartnerHugAnimation() {
    soundReceived();

    const big = document.createElement('div');
    big.className = 'big-hug';
    big.textContent = '💌';
    document.body.appendChild(big);
    setTimeout(() => big.remove(), 1000);

    const emojis = ['💙','💌','🩵','💫'];
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        const h = document.createElement('div');
        h.className = 'fly-heart';
        h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = (25 + Math.random() * 50) + '%';
        h.style.top = (55 + Math.random() * 15) + '%';
        h.style.fontSize = (24 + Math.random() * 16) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1700);
      }, i * 70);
    }

    if (navigator.vibrate) navigator.vibrate([15, 30, 15]);
  }

  function bumpCounter(el) {
    el.classList.add('bump');
    setTimeout(() => el.classList.remove('bump'), 400);
  }

  function setStatus(text, connected) {
    statusEl.innerHTML = '<span class="dot ' + (connected ? '' : 'off') + '"></span> ' + text;
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  });
</script>
</body>
</html>
